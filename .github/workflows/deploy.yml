name: deploy

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - run: docker build . -t soban11776/build-max
    - run: echo "${{secrets.DOCKER_HUB_PSWD_TWO}}" | docker login -u ${{DOCKER_NAME_TWO}} --password-stdin
    - run: docker push soban11776/build-max



 
   