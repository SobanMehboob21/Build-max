version: '3.8' 
services:
  frontend:
    build: ./client/my-app 
    ports:
      - "3000:3000"        
    stdin_open: true       
    tty: true

  backend:
    build: ./server         
    ports:
      - "5000:5000"
    depends_on:
      - db                 
    environment:
      - MONGO_URI=${MONGO_URI}

  db:
    image: mongo:latest     
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db 

volumes:
  mongo-data:              
